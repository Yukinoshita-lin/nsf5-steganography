# 打 tag 自动出 Windows 安装包 (打包计划 M4, 见 docs/PACKAGING.md)。
# 首次触发: git tag v1.8.0 && git push origin v1.8.0
# 产物 (GitHub Release): setup exe + 便携 zip + wheel。
name: release

on:
  push:
    tags: ["v*"]
  # 2026-09-30 审计: 这条链路此前**只在 tag 上跑**, 于是它的前两次真实运行
  # (v1.8.0) 都以失败告终 —— 打包问题在"已经发布"之后才暴露。加一个手动
  # 触发: 打 tag 前先在这里 dry-run 一遍(构建 + 冻结冒烟 + 装 Inno 出安装器),
  # 只有 tag 事件才会真的把产物发到 Release(见下面的 if 条件)。
  # 用法: gh workflow run release.yml --ref main
  workflow_dispatch:

permissions:
  contents: write      # softprops/action-gh-release 需要写 Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # runner 控制台是 cp1252, 脚本里的中文 print 会 UnicodeEncodeError;
      # UTF-8 mode 一并让冻结子进程的 stdio 可预期
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: python -m pip install -e ".[dev]" pyinstaller

      - name: 编译 C++ 加速库
        run: python scripts/build_cpp.py

      - name: 冻结打包 (双 exe + 便携 zip)
        run: python scripts/build_exe.py

      - name: 冻结冒烟 (体积/往返/ML 一致/GUI 主题)
        run: python scripts/test_frozen.py

      - name: 构建 wheel
        run: python -m build --wheel

      - name: 安装 Inno Setup
        run: choco install innosetup -y --no-progress

      - name: 构建安装器
        run: python scripts/build_installer.py

      - name: 安装器静默安装/卸载冒烟
        # 2026-09-30 审计: 这条链路此前只验证"冻结目录里的 exe 能跑"
        # (scripts/test_frozen.py), 而 docs/PACKAGING.md 里"静默安装 → 开始菜单
        # → 加 PATH → 静默卸载 → PATH 还原"这套**安装器自身**的行为只在
        # 本机手工做过一次, CI 从没验证过 —— 安装器的注册表/PATH 逻辑是
        # 最容易在别人机器上出问题的地方。这里在 CI 里真的装一次、跑一次、
        # 卸一次。
        #   /TASKS= 空 -> 不创建快捷方式、**不动 PATH**(下面会断言 PATH 未变),
        #   安装到临时目录 -> 不污染 runner 的用户目录。
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = (Get-ChildItem dist/nsf5stego-setup-*.exe | Select-Object -First 1).FullName
          if (-not $setup) { throw "没有找到 setup exe" }
          Write-Host "setup: $setup"

          $dir = Join-Path $env:RUNNER_TEMP "nsf5-install-smoke"
          if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
          $envKey = "HKCU:\Environment"
          $pathBefore = (Get-ItemProperty -Path $envKey -Name Path -ErrorAction SilentlyContinue).Path

          # 静默安装(每用户, PrivilegesRequired=lowest, 不需要管理员)
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES",
               "/NORESTART", "/DIR=`"$dir`"", "/TASKS=" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "安装器退出码 $($p.ExitCode)" }

          $cli = Join-Path $dir "nsf5stego.exe"
          $gui = Join-Path $dir "nsf5stego-gui.exe"
          if (-not (Test-Path $cli)) { throw "安装后没有 $cli" }
          if (-not (Test-Path $gui)) { throw "安装后没有 $gui" }
          $ver = (& $cli --version | Out-String).Trim()
          Write-Host "installed CLI: $ver"
          if ($ver -notmatch "^\s*nsf5stego\s+\d+\.\d+") { throw "装好的 CLI --version 输出异常: $ver" }

          # 装好的 exe 能不能真的用(模型/DLL 都随安装目录就位) —— 往返一次
          $work = Join-Path $env:RUNNER_TEMP "nsf5-install-work"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          & $cli embed img/cover.png -m "installer-smoke" -o "$work/stego.png" | Out-Null
          $out = (& $cli extract "$work/stego.png" | Out-String)
          if ($out -notmatch "installer-smoke") { throw "装好的 exe 往返失败: $out" }
          Write-Host "[OK] 安装后的 CLI 往返一致"

          # PATH 不该被动过(/TASKS= 没有选 addpath 任务)
          $pathAfter = (Get-ItemProperty -Path $envKey -Name Path -ErrorAction SilentlyContinue).Path
          if ($pathBefore -ne $pathAfter) {
            throw "安装/卸载动了用户 PATH:`n  before=$pathBefore`n  after =$pathAfter"
          }
          Write-Host "[OK] 未选择 addpath 任务时, 用户 PATH 保持不变"

          # 静默卸载, 应用目录应被清掉
          $unins = Get-ChildItem -Path $dir -Filter "unins*.exe" | Select-Object -First 1
          if (-not $unins) { throw "安装目录里没有卸载器" }
          $p2 = Start-Process -FilePath $unins.FullName -ArgumentList "/VERYSILENT",
                "/SUPPRESSMSGBOXES", "/NORESTART" -PassThru -Wait
          if ($p2.ExitCode -ne 0) { throw "卸载器退出码 $($p2.ExitCode)" }
          if (Test-Path $cli) { throw "卸载后 $cli 仍然存在" }
          Write-Host "[OK] 静默卸载完成, 应用目录已清理"

      - name: 上传构建物 (随时可查, 含 GUI 探针截图)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          if-no-files-found: warn
          path: |
            dist/nsf5stego-setup-*.exe
            dist/nsf5stego-portable-*.zip
            dist/*.whl
            build/pkg-test/gui_probe.png

      - name: 发布 GitHub Release
        # ci.yml 的 release 作业同样在 v* tag 上创建 Release 并生成发布说明;
        # 这里只负责把 Windows 产物追加到同一个 Release (softprops 对已存在的
        # tag 会做更新), 不重复生成 notes, 避免两个工作流抢发布说明。
        # 手动 dry-run (workflow_dispatch) 时**不发布**, 只验证链路。
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/nsf5stego-setup-*.exe
            dist/nsf5stego-portable-*.zip
            dist/*.whl
