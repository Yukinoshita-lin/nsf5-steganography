name: Build and deploy Jupyter Book site (zh + en)

on:
  push:
    branches: [main]
    paths:
      - "teaching/web/**"
      - "webapp/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install Jupyter Book
        run: pip install -r teaching/web/requirements.txt
      - name: Build Chinese book
        run: jupyter-book build teaching/web/zh
      - name: Build English book
        run: jupyter-book build teaching/web/en
      - name: Assemble static site
        run: |
          rm -rf site
          cp -r webapp site
          mkdir -p site/zh site/en
          cp -r teaching/web/zh/_build/html/. site/zh/
          cp -r teaching/web/en/_build/html/. site/en/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

  notify:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ always() && needs.build.result == 'success' }}
    steps:
      - run: 'echo "Handbook site deployed: ${{ needs.build.outputs.page_url }}"'
