name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# 2026-09-30 审计: 最小权限。原来这里是 workflow 级的 `contents: write`,
# 等于给**每个作业**(pytest / xvfb GUI / notebook / 构建…)都发了写仓库的令牌;
# 真正需要写的只有下面那个 `release` 作业(它要创建 GitHub Release)。
permissions:
  contents: read

jobs:
  test:
    name: 测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装依赖
        run: pip install --upgrade pip numpy pillow
      - name: 核心算法测试 (nsF5/matrix/湿纸/汉明码/口令)
        run: python src/test_core.py
      - name: 盲隐写分析测试 (区分 干净/含密)
        run: python src/test_steg.py
      - name: 假阳性回归测试 (干净图不得判为高概率隐写)
        run: python src/test_false_positive.py

  pytest:
    name: pytest (完整依赖)
    runs-on: ubuntu-latest
    # 2026-09-17: 一次 fork + OpenMP 死锁让这个作业从 1 分 44 秒变成挂满
    # **6 小时**才被 GitHub 的默认上限取消 (日志里只剩 5 个 python 孤儿进程)。
    # 死锁本身已经在 experiments/ood_eval.py 里修掉 (显式 spawn + 分片超时),
    # 这里的 timeout 是兜底: 任何"永远在跑"都必须变成 25 分钟内的失败。
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # yccstego: JPEG 压缩域桥接 (jpegstego.py) 的测试必须在 CI 真跑,
          # 不允许"本地装了所以一直绿" —— 与 GUI 测试同一纪律。
          # lightgbm 是必需的: 随仓库分发的两个部署模型就是 LGBMClassifier,
          # 缺它 ml_predict 会静默退回 available=False。
          python -m pip install numpy pillow matplotlib joblib \
            scikit-learn pandas lightgbm xgboost pytest pytest-cov yccstego
      - name: 安装虚拟显示 (xvfb)
        # 覆盖率必须和"有显示"的环境可比: gui.py 有 670 行, 没有显示时
        # test_gui_smoke 会跳过, 覆盖率会从 ~69% 掉到 ~51% —— 那样 65% 门槛
        # 测的就不是代码质量, 而是"这台机器有没有屏幕"。
        run: sudo apt-get update && sudo apt-get install -y xvfb
      # 覆盖率在 2026-09-14 之前没有任何度量 (34 用例 / 16.6k 行)。当时实测 52%,
      # 补上"实验链冒烟"(造图→make_dataset→train_model→run_e2e) 后到 69%。
      # 门槛 65 是"不许掉下去"的护栏, 留了跨平台差异的余量 (Linux 上 C++ 库不在)。
      - name: 全部测试 + 覆盖率
        run: xvfb-run -a python -m pytest -q --cov --cov-report=term --cov-fail-under=65

  gui:
    name: GUI 冒烟测试 (xvfb)
    runs-on: ubuntu-latest
    env:
      # pytest 里的 test_gui_smoke 在无显示时跳过 (否则任何无头机器跑 pytest
      # 都会红)。这个 job 的职责就是让"跳过"必须真的跑一次, 所以把跳过转成失败。
      NSF5_REQUIRE_GUI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖与虚拟显示
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow matplotlib
          sudo apt-get update && sudo apt-get install -y xvfb
      - name: 无头运行 GUI 冒烟测试
        run: xvfb-run -a python src/test_gui.py

  feature-consistency:
    name: 特征口径一致性 (CPU vs GPU)
    # 2026-09-14 审计发现: gpu/featurize_v2_gpu.py 曾把像素先 /255 再过高通核,
    # 使 GPU 产出的 srm_* 与推理端 CPU 特征差约 30 倍 —— 语料用 GPU 特征建、
    # 单图判定走 CPU 特征, 等于给 143d 模型喂分布外输入。
    # torch 只在这个 job 装 (CPU wheel), 免得拖慢主测试。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow matplotlib scikit-learn joblib pandas pytest
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: 143 维特征 CPU/GPU 必须同尺度
        run: python -m pytest -q src/test_pipeline.py::test_v2_cpu_gpu_consistency

  notebooks:
    name: 教学 notebook (生成一致 + 可执行)
    timeout-minutes: 20
    # 2026-09-14 审计: notebooks/ 是教学交付物, 却从未被执行过 —— 03 号笔记本
    # 让学员嵌入 5000 字符, 而 img/cover.png 的容量只有 3494 字节, 一直抛
    # ValueError 而无人发现。这个 job 把"可执行"变成 CI 事实:
    #   1) 生成器与入库 notebook 必须一致 (防手工改动被下次生成覆盖);
    #   2) 10 本逐个跑通 (nbclient, 无头)。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow matplotlib scikit-learn joblib pandas \
            lightgbm nbclient nbformat ipykernel
      - name: 入库 notebook 必须与生成器一致
        run: |
          python teaching/build_notebooks.py
          if ! git diff --quiet -- notebooks/; then
            echo "::error::notebooks/ 与 teaching/build_notebooks.py 不一致; 请跑 'make notebooks' 并提交结果"
            git diff --stat -- notebooks/
            exit 1
          fi
          echo "notebooks/ 与生成器一致"
      - name: 逐本执行 notebook
        run: python teaching/run_notebooks.py --timeout 900

  handbook:
    name: 手册事实校验
    timeout-minutes: 15
    # 2026-09-14 审计: 两本手册 (DOCX + 网页版) 长期带着被推翻的结论
    # (0.9085/0.9227、"53d AUC 更高"、"SRM 是噪声"、"OOD 1/8/3/8"、指向已删除的
    # thesis/)。教学材料带错结论比没结论更糟, 所以把它变成 CI 事实。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-docx pypdf numpy pillow matplotlib \
            scikit-learn joblib pandas lightgbm yccstego
      - name: 手册不得含陈旧结论, 且必须含现口径
        run: python teaching/handbook_facts.py --check
      # 手册里的 python 片段必须真的能跑 (2026-09-14 首跑就抓到 3 处示例直接抛异常)
      - name: 手册代码片段可执行 + 期望输出
        run: python teaching/verify_handbook_experiments.py

  attribution:
    name: 提交署名 (无 AI 共同作者尾注)
    # 2026-09-14: 17 个提交被 Claude Code 自动追加了
    #   Co-Authored-By: Claude Code <noreply@anthropic.com>
    # GitHub 把它们显示成共同作者; 删分支没用 (提交已并入主干), 只能改写历史。
    # 现在提交钩子会当场去掉 (.githooks/commit-msg), 这个 job 负责兜底:
    # 一旦历史里再出现这类尾注就红, 而不是等别人看到。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 需要完整历史才能检查
      - name: 历史里不得出现 AI 共同作者尾注
        run: |
          if git log --format=%B | grep -Eiq '^Co-Authored-By:.*(anthropic|openai|claude|codex|copilot|trae)'; then
            echo "::error::发现 AI 共同作者尾注; 可用 scripts/strip_ai_trailers.py + git filter-branch 清理"
            git log --format='%h %s' -i --grep='co-authored-by:.*claude' | head -5
            exit 1
          fi
          echo "历史干净: 无 AI 共同作者尾注"

  build:
    name: 构建 wheel + sdist
    runs-on: ubuntu-latest
    # 2026-09-30 审计: 这里原来只等 `test`(Python 3.9/3.11 的算法自测), 于是
    # **pytest 红了也照样发布** —— v1.8.2 的 tag 运行就是活例: `pytest (完整依赖)`
    # 失败(我的超时用例 flake), 而 `发布到 PyPI` 与 `发布 GitHub Release` 都成功了。
    # 现在把"全部验证作业"都作为发布的前置: 任何一个红, build / release / pypi 都不跑。
    # 它们本来就是并行跑的, 所以这只增加约束、不增加墙钟时间。
    needs: [test, pytest, gui, feature-consistency, notebooks, handbook, attribution]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - name: 安装构建工具
        run: pip install --upgrade pip build
      - name: 构建
        run: python -m build
      - name: 校验 wheel
        run: pip install dist/*.whl && python -c "import ns5_core, steganalysis; print('import ok')"
      - name: 干净 env 里验证模型随包安装且能打分 (安装布局)
        # 2026-09-15: 此前 wheel 里根本没有 models/, 而 ml_predict 只按仓库布局
        # 找 —— `pip install nsf5stego` 之后 ML 判定永远 available=False (依赖里
        # 却装着 lightgbm, README 也写着有 ML 功能)。这一步在**干净 venv +
        # 安装布局**里验证三件事: 模型在包里、路径解析走安装布局、模型能真的
        # 打出一个概率。合约测试 (src/test_model_cards.py) 只能检查 pyproject
        # 的声明, 这里才是"装了真的能用"。
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --quiet --upgrade pip
          /tmp/wheel-venv/bin/pip install --quiet dist/*.whl
          cd /tmp
          /tmp/wheel-venv/bin/python - <<'PY'
          import pathlib
          import numpy as np
          import ml_predict

          p = ml_predict.MLPredictor()
          assert p.available, f"ML 模型未随包安装: {p.load_error}"
          assert "site-packages" in ml_predict.MODEL_PATH, ml_predict.MODEL_PATH
          assert pathlib.Path(ml_predict.MODEL_PATH).name == "stego_classifier.joblib"
          img = np.random.default_rng(0).integers(0, 256, (256, 256), dtype=np.uint8)
          r = p.predict(img)
          assert isinstance(r["probability"], float), r
          print("OK", ml_predict.MODEL_PATH, r["probability"])
          PY
      - name: 干净 env 里验证发布入口 (nsf5stego CLI 往返)
        # 2026-09-30 审计: 上面那步只验证"模型随包可用"。1.8.0 的 headline 是
        # **正式 CLI**([project.scripts] nsf5stego = cli:main), 而 CI 里没有任何
        # 一步真的调用过安装后的 console script —— 入口名写错/漏 py-modules 都
        # 不会被发现。这里在同一个干净 venv 里跑一次真实的命令行往返。
        run: |
          cd /tmp
          /tmp/wheel-venv/bin/nsf5stego --version
          /tmp/wheel-venv/bin/python -c "
          import numpy as np
          from PIL import Image
          img = np.random.default_rng(0).integers(0, 256, (256, 256), dtype=np.uint8)
          Image.fromarray(img).save('/tmp/cover_cli.png')
          "
          /tmp/wheel-venv/bin/nsf5stego embed /tmp/cover_cli.png -m "wheel-cli-roundtrip" -o /tmp/stego_cli.png
          /tmp/wheel-venv/bin/nsf5stego extract /tmp/stego_cli.png | tail -1 | grep -q "wheel-cli-roundtrip"
          /tmp/wheel-venv/bin/nsf5stego analyze /tmp/cover_cli.png --json > /tmp/analyze_cli.json
          /tmp/wheel-venv/bin/python -c "
          import json
          d = json.load(open('/tmp/analyze_cli.json'))
          assert 'stego_probability' in d and 'image_sha256' in d, sorted(d)
          print('CLI OK:', d['verdict'])
          "
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    name: 发布 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write          # 只有这个作业需要写 (创建 Release / 上传资产)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: 创建 Release 并上传包
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  pypi:
    name: 发布到 PyPI (API token)
    # 2026-09-14: PyPI 上的 nsf5stego 还停在 1.4.0 (依赖里连 lightgbm 都没有,
    # 装了也加载不了模型)。这里补上发布步骤。
    #
    # 2026-09-30: PyPI 发布改为 API token 认证 (secrets.PYPI_API_TOKEN,
    # 1.8.0 起生效; v1.8.0 本体已用同一 token 经 twine 上传)。此前计划走
    # trusted publishing, 但 pypi.org 端的 pending publisher 一直没配置,
    # v1.8.0 首次 tag 发布在该作业上失败。
    # token 在仓库 Settings → Secrets → Actions 里维护; 若日后改回
    # trusted publishing (更安全, 无长期凭据), 删掉 password 行并按
    #   PyPI → nsf5stego → Publishing → Add a new pending publisher
    #     Owner=Yukinoshita-lin, Repository=nsf5-steganography,
    #     Workflow=ci.yml, Environment=pypi
    # 配置即可, 本作业的 `environment: pypi` 已就位。
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_TO_PYPI == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    # 2026-09-30 审计: 当前用 API token 认证, 不再需要 OIDC, 所以这里不给
    # `id-token: write`(最小权限)。切回 trusted publishing 时把它加回来:
    #   permissions:
    #     id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_API_TOKEN }}
