name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: 测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装依赖
        run: pip install --upgrade pip numpy pillow
      - name: 核心算法测试 (nsF5/matrix/湿纸/汉明码/口令)
        run: python src/test_core.py
      - name: 盲隐写分析测试 (区分 干净/含密)
        run: python src/test_steg.py
      - name: 假阳性回归测试 (干净图不得判为高概率隐写)
        run: python src/test_false_positive.py

  pytest:
    name: pytest (完整依赖)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # lightgbm 是必需的: 随仓库分发的两个部署模型就是 LGBMClassifier,
          # 缺它 ml_predict 会静默退回 available=False。
          python -m pip install numpy pillow matplotlib joblib \
            scikit-learn pandas lightgbm xgboost pytest pytest-cov
      - name: 安装虚拟显示 (xvfb)
        # 覆盖率必须和"有显示"的环境可比: gui.py 有 670 行, 没有显示时
        # test_gui_smoke 会跳过, 覆盖率会从 ~69% 掉到 ~51% —— 那样 65% 门槛
        # 测的就不是代码质量, 而是"这台机器有没有屏幕"。
        run: sudo apt-get update && sudo apt-get install -y xvfb
      # 覆盖率在 2026-09-14 之前没有任何度量 (34 用例 / 16.6k 行)。当时实测 52%,
      # 补上"实验链冒烟"(造图→make_dataset→train_model→run_e2e) 后到 69%。
      # 门槛 65 是"不许掉下去"的护栏, 留了跨平台差异的余量 (Linux 上 C++ 库不在)。
      - name: 全部测试 + 覆盖率
        run: xvfb-run -a python -m pytest -q --cov --cov-report=term --cov-fail-under=65

  gui:
    name: GUI 冒烟测试 (xvfb)
    runs-on: ubuntu-latest
    env:
      # pytest 里的 test_gui_smoke 在无显示时跳过 (否则任何无头机器跑 pytest
      # 都会红)。这个 job 的职责就是让"跳过"必须真的跑一次, 所以把跳过转成失败。
      NSF5_REQUIRE_GUI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖与虚拟显示
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow matplotlib
          sudo apt-get update && sudo apt-get install -y xvfb
      - name: 无头运行 GUI 冒烟测试
        run: xvfb-run -a python src/test_gui.py

  feature-consistency:
    name: 特征口径一致性 (CPU vs GPU)
    # 2026-09-14 审计发现: gpu/featurize_v2_gpu.py 曾把像素先 /255 再过高通核,
    # 使 GPU 产出的 srm_* 与推理端 CPU 特征差约 30 倍 —— 语料用 GPU 特征建、
    # 单图判定走 CPU 特征, 等于给 143d 模型喂分布外输入。
    # torch 只在这个 job 装 (CPU wheel), 免得拖慢主测试。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow matplotlib scikit-learn joblib pandas pytest
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: 143 维特征 CPU/GPU 必须同尺度
        run: python -m pytest -q src/test_pipeline.py::test_v2_cpu_gpu_consistency

  notebooks:
    name: 教学 notebook (生成一致 + 可执行)
    # 2026-09-14 审计: notebooks/ 是教学交付物, 却从未被执行过 —— 03 号笔记本
    # 让学员嵌入 5000 字符, 而 img/cover.png 的容量只有 3494 字节, 一直抛
    # ValueError 而无人发现。这个 job 把"可执行"变成 CI 事实:
    #   1) 生成器与入库 notebook 必须一致 (防手工改动被下次生成覆盖);
    #   2) 10 本逐个跑通 (nbclient, 无头)。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow matplotlib scikit-learn joblib pandas \
            lightgbm nbclient nbformat ipykernel
      - name: 入库 notebook 必须与生成器一致
        run: |
          python teaching/build_notebooks.py
          if ! git diff --quiet -- notebooks/; then
            echo "::error::notebooks/ 与 teaching/build_notebooks.py 不一致; 请跑 'make notebooks' 并提交结果"
            git diff --stat -- notebooks/
            exit 1
          fi
          echo "notebooks/ 与生成器一致"
      - name: 逐本执行 notebook
        run: python teaching/run_notebooks.py --timeout 900

  handbook:
    name: 手册事实校验
    # 2026-09-14 审计: 两本手册 (DOCX + 网页版) 长期带着被推翻的结论
    # (0.9085/0.9227、"53d AUC 更高"、"SRM 是噪声"、"OOD 1/8/3/8"、指向已删除的
    # thesis/)。教学材料带错结论比没结论更糟, 所以把它变成 CI 事实。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-docx pypdf numpy pillow matplotlib \
            scikit-learn joblib pandas lightgbm
      - name: 手册不得含陈旧结论, 且必须含现口径
        run: python teaching/handbook_facts.py --check
      # 手册里的 python 片段必须真的能跑 (2026-09-14 首跑就抓到 3 处示例直接抛异常)
      - name: 手册代码片段可执行 + 期望输出
        run: python teaching/verify_handbook_experiments.py

  attribution:
    name: 提交署名 (无 AI 共同作者尾注)
    # 2026-09-14: 17 个提交被 Claude Code 自动追加了
    #   Co-Authored-By: Claude Code <noreply@anthropic.com>
    # GitHub 把它们显示成共同作者; 删分支没用 (提交已并入主干), 只能改写历史。
    # 现在提交钩子会当场去掉 (.githooks/commit-msg), 这个 job 负责兜底:
    # 一旦历史里再出现这类尾注就红, 而不是等别人看到。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 需要完整历史才能检查
      - name: 历史里不得出现 AI 共同作者尾注
        run: |
          if git log --format=%B | grep -Eiq '^Co-Authored-By:.*(anthropic|openai|claude|codex|copilot|trae)'; then
            echo "::error::发现 AI 共同作者尾注; 可用 scripts/strip_ai_trailers.py + git filter-branch 清理"
            git log --format='%h %s' -i --grep='co-authored-by:.*claude' | head -5
            exit 1
          fi
          echo "历史干净: 无 AI 共同作者尾注"

  build:
    name: 构建 wheel + sdist
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - name: 安装构建工具
        run: pip install --upgrade pip build
      - name: 构建
        run: python -m build
      - name: 校验 wheel
        run: pip install dist/*.whl && python -c "import ns5_core, steganalysis; print('import ok')"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    name: 发布 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: 创建 Release 并上传包
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  pypi:
    name: 发布到 PyPI (trusted publishing)
    # 2026-09-14: PyPI 上的 nsf5stego 还停在 1.4.0 (依赖里连 lightgbm 都没有,
    # 装了也加载不了模型)。这里补上发布步骤。
    #
    # 默认**不执行**: 需要先在 PyPI 上配置好 trusted publisher
    #   PyPI → Your projects → nsf5stego → Publishing → Add a new pending publisher
    #     Owner:            Yukinoshita-lin
    #     Repository:       nsf5-steganography
    #     Workflow name:    ci.yml
    #     Environment:      pypi
    # 配置完在仓库里设一个变量 `PUBLISH_TO_PYPI=true` (Settings → Variables) 即可启用。
    # 这样在没配置之前, tag 上的 CI 不会因为这一步无谓地变红。
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_TO_PYPI == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # trusted publishing 用 OIDC, 不需要 API token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
