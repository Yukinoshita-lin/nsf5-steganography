name: Cross-platform tests (Linux / macOS / Windows)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "teaching/build_notebooks.py"
      - ".github/workflows/cross-platform.yml"
  workflow_dispatch:

jobs:
  test:
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow matplotlib scikit-learn joblib pandas
      - name: Algorithm self-tests
        run: |
          python src/test_core.py
          python src/test_steg.py
          python src/test_false_positive.py
      - name: Pure-Python feature fallback
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); \
          import numpy as np; \
          from py_features import features; \
          from featurize_v2 import featurize_v2; \
          a = np.random.default_rng(0).integers(0, 256, (128, 128), dtype=np.uint8); \
          assert len(features(a)) == 11; \
          assert featurize_v2(a).shape == (143,); \
          print('pure-python features OK')"
      - name: cppembed graceful fallback
        shell: bash
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); \
          import numpy as np; \
          from ns5_core import embed_string as py_embed, extract_string; \
          import cppembed; \
          img = np.random.default_rng(1).integers(24, 232, (256, 256), dtype=np.uint8); \
          stego, rep, _ = cppembed.embed_string(img, 'cross-platform', method='nsF5', p=3); \
          assert extract_string(stego, method='nsF5', p=3) == 'cross-platform'; \
          print('cppembed fallback OK, changed =', rep['cover_changed'])"
