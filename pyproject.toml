[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nsf5stego"
version = "1.2.0"
description = "nsF5 steganography tool: syndrome matrix coding (Hamming) + wet-paper coding + image-hash keying + blind steganalysis + GUI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "nsf5stego", email = "dev@example.com" }]
keywords = ["steganography", "nsf5", "f5", "hamming", "steganalysis", "image"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Topic :: Multimedia :: Graphics",
]
dependencies = ["numpy", "Pillow"]

[project.urls]
Homepage = "https://github.com/Yushitayuri/nsf5-steganography"
Repository = "https://github.com/Yushitayuri/nsf5-steganography"

[project.scripts]
nsf5stego = "gui:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["ns5_core", "steganalysis", "efficiency", "image_io", "gui",
              "cppembed", "fsfeatures", "ml_predict", "make_dataset", "train_model"]